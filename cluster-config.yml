# kind-config.yaml

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: skillpulse-cluster

nodes:

  # Control Plane (Master)
  - role: control-plane
    image: kindest/node:v1.30.0

    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP

      - containerPort: 30443
        hostPort: 443
        protocol: TCP

      - containerPort: 30090
        hostPort: 9090
        protocol: TCP

      - containerPort: 30300
        hostPort: 3000
        protocol: TCP

  # Worker Node 1
  - role: worker
    image: kindest/node:v1.30.0

  # Worker Node 2
  - role: worker
    image: kindest/node:v1.30.0
