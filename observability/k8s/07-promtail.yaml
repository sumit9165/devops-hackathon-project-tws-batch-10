apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: observability

spec:
  selector:
    matchLabels:
      app: promtail

  template:
    metadata:
      labels:
        app: promtail

    spec:
      serviceAccountName: default

      containers:
        - name: promtail
          image: grafana/promtail:latest

          args:
            - "-config.file=/etc/promtail/config.yaml"

          volumeMounts:
            - name: config
              mountPath: /etc/promtail

            - name: varlog
              mountPath: /var/log

            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: promtail-config

        - name: varlog
          hostPath:
            path: /var/log

        - name: containers
          hostPath:
            path: /var/lib/docker/containers
